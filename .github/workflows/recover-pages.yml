name: Recover stuck GitHub Pages deployment

on:
  push:
    branches:
      - main

permissions:
  actions: write
  pages: write

jobs:
  recover:
    if: startsWith(github.event.head_commit.message, 'chore: recover stuck Pages deployment')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stale deployment and monitor the new Pages build
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              const result = await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                {
                  owner,
                  repo,
                  pages_deployment_id: 'de9c95387900434f50fd1e5e7a5ff4647724176f',
                }
              );
              core.info(`Cancel request accepted: HTTP ${result.status}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              core.warning('The stale deployment is already absent; checking the new Pages run.');
            }

            const deadline = Date.now() + 210000;
            let retriedRun = false;
            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: context.sha,
                per_page: 20,
              });
              const pagesRun = response.data.workflow_runs.find(
                run => run.name.toLowerCase() === 'pages build and deployment' && run.id !== context.runId
              );
              if (pagesRun?.status === 'completed') {
                if (pagesRun.conclusion === 'success') {
                  core.info(`Pages deployment succeeded: ${pagesRun.html_url}`);
                  return;
                }
                if (pagesRun.conclusion === 'failure' && !retriedRun) {
                  retriedRun = true;
                  core.warning(`Pages run failed after clearing the stale deployment: ${pagesRun.html_url}`);
                  try {
                    await github.request(
                      'POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
                      { owner, repo, run_id: pagesRun.id }
                    );
                    core.info('Requested one retry of the failed Pages deployment job.');
                    return;
                  } catch (error) {
                    core.warning(`GitHub did not allow a Pages retry: ${error.message}`);
                    return;
                  }
                }
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.warning('Timed out while monitoring Pages; inspect the latest GitHub Pages workflow run.');
